<style>
/* Layout: una sola columna tipo app de iPhone, barra de pestañas fija abajo y botón + central. */
:root {
  --bg: #F2F4F3;
  --surface: #FFFFFF;
  --surface-2: #E8ECEA;
  --ink: #17201C;
  --muted: #5E6B65;
  --line: #DCE2DF;
  --accent: #1F6B55;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEFE7;
  --danger: #B42318;
  --danger-soft: #FCE8E6;
  --warn: #9A5B00;
  --warn-soft: #FDF0D8;
  --ok: #1D7A45;
  --ok-soft: #DDF3E5;
  --card-clasica: #2D5BD7;
  --card-joy: #B5308F;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
  --font-num: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Display", "Inter", sans-serif;
  --r: 16px;
  --tab-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1311; --surface: #18201C; --surface-2: #222C27; --ink: #E9EFEC; --muted: #98A6A0; --line: #2A3530;
    --accent: #4FB892; --accent-ink: #062018; --accent-soft: #173A2E;
    --danger: #FF7A6E; --danger-soft: #3A1A17; --warn: #F2B557; --warn-soft: #3A2C12; --ok: #5FD394; --ok-soft: #153523;
    --card-clasica: #6E93FF; --card-joy: #F073C9;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1311; --surface: #18201C; --surface-2: #222C27; --ink: #E9EFEC; --muted: #98A6A0; --line: #2A3530;
  --accent: #4FB892; --accent-ink: #062018; --accent-soft: #173A2E;
  --danger: #FF7A6E; --danger-soft: #3A1A17; --warn: #F2B557; --warn-soft: #3A2C12; --ok: #5FD394; --ok-soft: #153523;
  --card-clasica: #6E93FF; --card-joy: #F073C9;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 24px);
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
main { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; padding-top: 12px; }

/* Header */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 8px; }
.top h1 { font-size: 30px; line-height: 1.1; margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
.top .sub { color: var(--muted); font-size: 14px; }

/* Secciones */
.section { display: flex; flex-direction: column; gap: 10px; }
.section > h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 4px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.section > h2 a, .linkbtn { color: var(--accent); text-transform: none; letter-spacing: 0; font-size: 14px; text-decoration: none; background: none; border: 0; padding: 0; font-weight: 600; }
.panel { background: var(--surface); border-radius: var(--r); padding: 16px; }
.list { background: var(--surface); border-radius: var(--r); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); min-height: 56px; }
.row:first-child { border-top: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .s { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .amt { font-weight: 600; text-align: right; white-space: nowrap; }
button.row { width: 100%; background: none; border: 0; border-top: 1px solid var(--line); text-align: left; }
button.row:first-child { border-top: 0; }
.empty { padding: 20px 16px; color: var(--muted); text-align: center; font-size: 14px; }

/* Deuda hero */
.hero { background: var(--ink); color: var(--bg); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.hero .lbl { font-size: 13px; opacity: .75; }
.hero .big { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
.hero .delta { font-size: 13px; opacity: .85; }
.stack { display: flex; height: 10px; border-radius: 6px; overflow: hidden; gap: 2px; background: color-mix(in srgb, var(--bg) 18%, transparent); }
.stack span { display: block; height: 100%; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.legend div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.legend .n { font-size: 13px; opacity: .8; display: flex; align-items: center; gap: 6px; }
.legend .v { font-weight: 600; font-size: 17px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }

/* Semana */
.week { display: flex; flex-direction: column; gap: 10px; }
.week .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.week .big { font-size: 28px; font-weight: 700; }
.bar { height: 8px; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 6px; }
.bar.warn > span { background: var(--warn); }
.bar.over > span { background: var(--danger); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.banner { display: flex; align-items: center; gap: 12px; background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; }
.banner .grow { flex: 1; min-width: 0; font-size: 14px; }

/* Pills / fechas */
.pill { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.pill.danger { background: var(--danger-soft); color: var(--danger); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.cal { width: 44px; flex: none; text-align: center; border-radius: 10px; background: var(--surface-2); padding: 4px 0; line-height: 1.1; }
.cal b { display: block; font-size: 18px; }
.cal small { display: block; font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: .04em; }

/* Tiles cuentas */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--surface); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile .n { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v { font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Presupuesto */
.budget { display: flex; flex-direction: column; gap: 14px; }
.budget .it { display: flex; flex-direction: column; gap: 6px; }
.budget .it .l { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }

/* Botones */
.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 600; background: var(--surface-2); color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.danger { background: var(--danger-soft); color: var(--danger); }
.btn.sm { padding: 7px 12px; border-radius: 10px; font-size: 14px; }
.btn.block { width: 100%; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }

/* Tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs nav { max-width: 640px; margin: 0 auto; height: var(--tab-h); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; }
.tabs a { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); text-decoration: none; font-weight: 600; }
.tabs a[aria-current="page"] { color: var(--accent); }
.tabs svg { width: 24px; height: 24px; }
.fab { justify-self: center; width: 54px; height: 54px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 40%, transparent); margin-top: -18px; }
.fab svg { width: 28px; height: 28px; }

/* Hoja (bottom sheet) */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(40px); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto; }
.sheet header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sheet header h3 { margin: 0; font-size: 18px; }

/* Formularios */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 8px 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.amount { display: flex; align-items: center; justify-content: center; gap: 4px; background: var(--surface); border-radius: var(--r); padding: 14px; }
.amount span { font-size: 34px; font-weight: 700; color: var(--muted); }
.amount input { border: 0; background: transparent; font-size: 40px; font-weight: 700; width: 100%; max-width: 260px; text-align: center; outline: none; font-family: var(--font-num); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field > .lab { font-size: 13px; color: var(--muted); font-weight: 600; margin-left: 4px; }
.input { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 16px; min-width: 0; }
.input:focus { border-color: var(--accent); outline: none; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.info { border-radius: 12px; padding: 12px 14px; font-size: 14px; background: var(--accent-soft); }
.info.warn { background: var(--warn-soft); }
.info b { font-weight: 700; }
.check { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }

/* Movimientos */
.monthnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.monthnav b { font-size: 17px; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface); display: grid; place-items: center; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kpi { background: var(--surface); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 2px; }
.kpi .n { font-size: 12px; color: var(--muted); }
.kpi .v { font-size: 20px; font-weight: 700; }
.hbars { display: flex; flex-direction: column; gap: 12px; }
.hbar .l { display: flex; justify-content: space-between; font-size: 14px; gap: 8px; margin-bottom: 5px; }
.hbar .l span:first-child { display: flex; align-items: center; gap: 6px; min-width: 0; }
.daylabel { font-size: 13px; color: var(--muted); font-weight: 600; margin: 6px 4px -4px; }
.row .s.wrap { white-space: normal; }
.row .t.done { text-decoration: line-through; color: var(--muted); }
.tick { width: 26px; height: 26px; flex: none; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--muted); }
.tick.on { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.hero .prog { display: flex; flex-direction: column; gap: 6px; }
.hero .prog .l { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; opacity: .85; flex-wrap: wrap; }
.pbar { height: 8px; border-radius: 6px; overflow: hidden; background: color-mix(in srgb, var(--bg) 18%, transparent); }
.pbar > span { display: block; height: 100%; background: var(--accent); border-radius: 6px; }
.neg { color: var(--ink); }
.pos { color: var(--ok); }

/* Plan */
.flow { display: flex; flex-direction: column; }
.flow .fl { display: flex; justify-content: space-between; gap: 8px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 15px; }
.flow .fl:first-child { border-top: 0; }
.flow .fl.total { font-weight: 700; }
.strat { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.strat .opt { background: var(--surface); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 4px; border: 2px solid transparent; }
.strat .opt.rec { border-color: var(--accent); }
.strat .opt .n { font-weight: 700; }
.strat .opt .k { font-size: 13px; color: var(--muted); }
.tablewrap { overflow-x: auto; background: var(--surface); border-radius: var(--r); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 9px 12px; text-align: right; white-space: nowrap; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
th { color: var(--muted); font-weight: 600; border-top: 0; }
th:first-child, td:first-child { text-align: left; }
.tips { display: flex; flex-direction: column; gap: 10px; }
.tip { background: var(--surface); border-radius: 14px; padding: 14px; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.tip b { font-size: 15px; }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
code, .code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: var(--surface-2); padding: 2px 6px; border-radius: 6px; word-break: break-all; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 16px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; z-index: 60; font-size: 14px; font-weight: 600; max-width: calc(100% - 32px); }
</style>

<script>
'use strict';
/* =========================================================
   Mis Finanzas — app personal. Todos los datos viven en este
   iPhone (localStorage). Nada se envía a ningún servidor.
   ========================================================= */

const STORE_KEY = 'misfinanzas.v1';

// ---------- Utilidades de fecha (siempre en hora local) ----------
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayD = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const todayS = () => ymd(todayD());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const daysIn = (y, m) => new Date(y, m + 1, 0).getDate();
// fecha con día "day" del mes m (m puede salirse de 0..11); si el mes es más corto, usa el último día
function dateFor(y, m, day) { const b = new Date(y, m, 1); const Y = b.getFullYear(), M = b.getMonth(); return new Date(Y, M, Math.min(day, daysIn(Y, M))); }
const diffDays = (a, b) => Math.round((parseD(ymd(b)) - parseD(ymd(a))) / 86400000);
const fmtDay = d => d.toLocaleDateString('es-MX', { day: 'numeric', month: 'short' }).replace('.', '');
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmtLong = d => cap(d.toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' }));
const fmtMonth = (y, m) => cap(new Date(y, m, 1).toLocaleDateString('es-MX', { month: 'long', year: 'numeric' }));
const MONTHS_SHORT = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MONTHS_LONG = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const WEEKDAYS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

// ---------- Dinero ----------
const mxn = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' });
const mxn0 = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0 });
const money = v => mxn.format(Math.abs(v) < 0.005 ? 0 : v);
const money0 = v => mxn0.format(Math.round(v));
const round2 = v => Math.round(v * 100) / 100;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const WEEKS_PER_MONTH = 52 / 12;

// ---------- Datos iniciales ----------
const EXPENSE_CATS = [
  { id: 'comida', name: 'Comida y antojos', color: '#E07A2F', budget: 2000 },
  { id: 'super', name: 'Súper', color: '#3E9C5A', budget: 1600 },
  { id: 'transporte', name: 'Transporte', color: '#3A7BD5', budget: 800 },

function cardBalance(id, upTo) {
  const c = card(id); let b = c.initial;
  for (const t of S.txns) {
    if (upTo && t.date > upTo) continue;
    if (t.type === 'gasto' && t.from === id) b += t.amount;
    else if (t.type === 'pago' && t.to === id) b -= t.amount;
    else if (t.type === 'ajuste' && t.to === id) b += t.amount;
  }
  return round2(b);
}
function acctBalance(id) {
  const a = acct(id); let b = a.initial;
  for (const t of S.txns) {
    if (t.type === 'ingreso' && t.to === id) b += t.amount;
    else if (t.type === 'gasto' && t.from === id) b -= t.amount;
    else if (t.type === 'pago' && t.from === id) b -= t.amount;
    else if (t.type === 'mover') { if (t.from === id) b -= t.amount; if (t.to === id) b += t.amount; }
    else if (t.type === 'ajuste' && t.to === id) b += t.amount;
  }
  return round2(b);
}
const totalDebt = () => round2(S.cards.reduce((s, c) => s + Math.max(0, cardBalance(c.id)), 0));

// ---------- Fechas de corte ----------
// Corte al que pertenece una compra hecha en la fecha d
function cutForPurchase(c, d) {
  const cut = dateFor(d.getFullYear(), d.getMonth(), c.cutDay);
  return d <= cut ? cut : dateFor(d.getFullYear(), d.getMonth() + 1, c.cutDay);
}
// Último corte que ya pasó (incluye hoy)
function lastCut(c, d) {
  const cut = dateFor(d.getFullYear(), d.getMonth(), c.cutDay);
  return d >= cut ? cut : dateFor(d.getFullYear(), d.getMonth() - 1, c.cutDay);
}
// Fecha límite de pago de un corte
function dueForCut(c, cut) {
  let d = dateFor(cut.getFullYear(), cut.getMonth(), c.payDay);
  if (d <= cut) d = dateFor(cut.getFullYear(), cut.getMonth() + 1, c.payDay);
  return d;
}
function paymentsBetween(id, afterS, upToS) {
  return S.txns.filter(t => ((t.type === 'pago' && t.to === id) || (t.type === 'ajuste' && t.to === id && t.amount < 0)) && t.date > afterS && (!upToS || t.date <= upToS))
    .reduce((s, t) => s + Math.abs(t.amount), 0);
}
// Estado de la tarjeta hoy
function cardStatus(c, today = todayD()) {
  const cut = lastCut(c, today);
  const due = dueForCut(c, cut);
  const stmt = Math.max(0, cardBalance(c.id, ymd(cut)));
  const paid = paymentsBetween(c.id, ymd(cut));
  const pending = round2(Math.max(0, stmt - paid));
  const nextCut = dateFor(cut.getFullYear(), cut.getMonth() + 1, c.cutDay);
  const nextDue = dueForCut(c, nextCut);
  return { cut, due, stmt, paid, pending, nextCut, nextDue, overdue: today > due && pending > 0.5, balance: cardBalance(c.id) };
}
function purchaseInfo(c, dateS) {
  const d = parseD(dateS);
  const cut = cutForPurchase(c, d);
  const due = dueForCut(c, cut);
  return { cut, due, days: diffDays(d, due) };
}

// ---------- Recurrentes (suscripciones / gastos fijos) ----------
function occurrences(r, from, to) {
  const out = []; const start = parseD(r.start || S.setupDate);
  const lo = from < start ? start : from;
  if (r.freq === 'semanal') {
    let d = new Date(lo); while (d.getDay() !== Number(r.day)) d = addDays(d, 1);
    for (; d <= to; d = addDays(d, 7)) out.push(new Date(d));
  } else if (r.freq === 'anual') {
    for (let y = lo.getFullYear(); y <= to.getFullYear(); y++) { const d = dateFor(y, Number(r.month || 0), Number(r.day)); if (d >= lo && d <= to) out.push(d); }
  } else { // mensual
    for (let y = lo.getFullYear(), m = lo.getMonth(); new Date(y, m, 1) <= to; m++) { const d = dateFor(y, m, Number(r.day)); if (d >= lo && d <= to) out.push(d); }
  }
  return out;
}
const monthlyOf = r => r.freq === 'semanal' ? r.amount * WEEKS_PER_MONTH : r.freq === 'anual' ? r.amount / 12 : r.amount;
// La renta se aparta aparte cada semana, así que lo que se paga desde el apartado no cuenta aquí
const fixedMonthly = () => S.recurring.filter(r => r.active !== false && r.from !== S.settings.rentAccount).reduce((s, r) => s + monthlyOf(r), 0);

// Registra solos los cobros automáticos que ya llegaron (p. ej. Netflix en tarjeta)
function runAutoCharges() {
  const today = todayD(); let n = 0;
  for (const r of S.recurring) {
    if (!r.auto || r.active === false) continue;
    r.paid = r.paid || [];
    for (const d of occurrences(r, addDays(today, -60), today)) {
      const ds = ymd(d); if (r.paid.includes(ds)) continue;
      S.txns.push({ id: uid(), date: ds, type: 'gasto', amount: r.amount, desc: r.name, cat: r.cat, from: r.from, rec: r.id, auto: true });
      r.paid.push(ds); n++;
    }
  }
  if (n) save();
  return n;
}

// ---------- Semana de pago ----------
function weekRange(today = todayD()) {
  let start = new Date(today); while (start.getDay() !== Number(S.settings.payWeekday)) start = addDays(start, -1);
  return { start, end: addDays(start, 6) };
}
const NON_DAILY = ['renta', 'servicios', 'gimnasio', 'suscripciones', 'intereses'];
const fixedWeekly = () => fixedMonthly() / WEEKS_PER_MONTH;
const debtWeekly = () => totalDebt() <= 0.5 ? 0 : Math.max(0, Number(S.settings.debtWeekly) || 0);
const livingWeekly = (dw = debtWeekly()) => S.settings.weeklyIncome - (Number(S.settings.rentWeekly) || 0) - fixedWeekly() - dw - (Number(S.settings.savingsWeekly) || 0);

function weekStats() {
  const { start, end } = weekRange(); const a = ymd(start), b = ymd(end);
  const inWeek = S.txns.filter(t => t.date >= a && t.date <= b);
  const sum = arr => arr.reduce((s, t) => s + t.amount, 0);
  const salaryIn = inWeek.some(t => t.type === 'ingreso' && t.cat === 'sueldo');
  const variable = sum(inWeek.filter(t => t.type === 'gasto' && !t.rec && !NON_DAILY.includes(t.cat)));
  const onCards = sum(inWeek.filter(t => t.type === 'gasto' && isCard(t.from)));
  const paidCards = sum(inWeek.filter(t => t.type === 'pago'));
  const rentSet = sum(inWeek.filter(t => t.type === 'mover' && t.to === S.settings.rentAccount));
  const weeklyFree = livingWeekly();
  return { start, end, salaryIn, variable, weeklyFree, left: weeklyFree - variable, onCards, paidCards, rentSet };
}

// Pago mínimo: el del estado de cuenta, o estimado (1.5% del saldo + intereses con IVA)
function estMin(c) {
  const b = Math.max(0, cardBalance(c.id)); if (b <= 0.5) return 0;
  return c.minPay || Math.ceil(b * 0.015 + b * c.rate / 100 / 12 * 1.16);
}
// Cuánto abonar a cada tarjeta en esta semana de pago
function weekPlan() {
  const { start, end } = weekRange(); const a = ymd(start), b = ymd(end);
  let left = debtWeekly(); const alloc = {}, why = {};
  const paidWeek = id => S.txns.filter(t => t.type === 'pago' && t.to === id && t.date >= a && t.date <= b).reduce((s, t) => s + t.amount, 0);
  // 1) Si una fecha límite cae antes del siguiente día de pago, primero cubre su mínimo
  for (const c of S.cards) {
    const st = cardStatus(c); if (st.stmt <= 0.5) continue;
    const dueS = ymd(st.due); if (dueS < a || dueS > ymd(addDays(end, 1))) continue;
    const paidBefore = paymentsBetween(c.id, ymd(st.cut), ymd(addDays(start, -1)));
    const need = Math.max(0, Math.min(estMin(c), st.stmt) - paidBefore);
    if (need > 0.5) { const p = Math.min(need, left); alloc[c.id] = p; left -= p; why[c.id] = `pago mínimo, vence el ${fmtDay(st.due)}`; }
  }
  // 2) Lo demás a la deuda más chica (bola de nieve)
  const bal = id => Math.max(0, cardBalance(id) + paidWeek(id));
  const order = S.cards.filter(c => bal(c.id) - (alloc[c.id] || 0) > 0.5).sort((x, y) => bal(x.id) - bal(y.id));
  for (const c of order) {
    if (left <= 0.5) break;
    const p = Math.min(left, bal(c.id) - (alloc[c.id] || 0));
    alloc[c.id] = (alloc[c.id] || 0) + p; left -= p;
    why[c.id] = why[c.id] ? why[c.id] + ' + abono extra' : 'prioridad: la más chica primero';
  }
  for (const id in alloc) alloc[id] = Math.round(alloc[id]);
  return { alloc, why, paid: Object.fromEntries(S.cards.map(c => [c.id, paidWeek(c.id)])) };
}

// ---------- Plan de deudas ----------
function simulate(monthly, strategy, cardsIn) {
  const bs = (cardsIn || S.cards.map(c => ({ id: c.id, name: c.short, bal: Math.max(0, cardBalance(c.id)), rate: c.rate, fee: c.fee || 0 }))).map(b => ({ ...b }));
  const startTotal = bs.reduce((s, b) => s + b.bal, 0);
  let month = 0, totalInt = 0, feasible = true; const rows = [];
  while (bs.some(b => b.bal > 0.5) && month < 240) {
    month++;
    const row = { month, pay: {}, bal: {}, int: 0 };
    const mins = {};
    for (const b of bs) {
      if (b.bal <= 0.5) { b.bal = 0; continue; }
      const i = b.bal * (b.rate / 100 / 12) * 1.16; // interés + IVA
      mins[b.id] = Math.min(b.bal + i, b.bal * 0.015 + i);
      const fee = b.fee || 0; // comisión mensual de la tarjeta
      b.bal += i + fee; totalInt += i + fee; row.int += i + fee;
    }
    let avail = monthly;
    const minSum = Object.values(mins).reduce((s, v) => s + v, 0);
    if (avail < minSum) feasible = false;
    for (const b of bs) { if (!mins[b.id]) continue; const p = Math.min(b.bal, avail >= minSum ? mins[b.id] : mins[b.id] * avail / minSum); b.bal -= p; avail -= p; row.pay[b.id] = p; }
    const order = bs.filter(b => b.bal > 0.5).sort(strategy === 'avalancha' ? (x, y) => (y.rate - x.rate) || (x.bal - y.bal) : (x, y) => (x.bal - y.bal));
    for (const b of order) { if (avail <= 0) break; const p = Math.min(b.bal, avail); b.bal -= p; avail -= p; row.pay[b.id] = (row.pay[b.id] || 0) + p; }
    for (const b of bs) row.bal[b.id] = Math.max(0, b.bal);
    rows.push(row);
    if (month > 2 && row.int >= monthly) { feasible = false; break; }
  }
  const done = !bs.some(b => b.bal > 0.5);
  return { months: done ? month : Infinity, totalInt, totalPaid: startTotal + totalInt, rows, feasible: feasible && done, order: bs };
}
const debtPlanAmount = () => debtWeekly() * WEEKS_PER_MONTH;
function bestStrategy(monthly) {
  const av = simulate(monthly, 'avalancha'), sb = simulate(monthly, 'bola');
  // Si la diferencia de intereses es menor a $300, conviene la bola de nieve por motivación
  const pick = (av.months === Infinity && sb.months === Infinity) ? 'avalancha' : (sb.totalInt - av.totalInt > 300 ? 'avalancha' : 'bola');
  return { av, sb, pick, chosen: pick === 'avalancha' ? av : sb };
}
function paymentForMonths(n, strategy) {
  let lo = 0, hi = totalDebt() * 3 + 1000;
  for (let i = 0; i < 40; i++) { const mid = (lo + hi) / 2; const r = simulate(mid, strategy); if (r.months <= n) hi = mid; else lo = mid; }
  return Math.ceil(hi / 50) * 50;
}

  for (const c of S.cards) {
    const st = cardStatus(c, today);
    if (st.pending > 0.5) items.push({ date: st.due, html: `<div class="row">${calChip(st.due)}<div class="grow"><div class="t">${esc(c.name)}</div><div class="s wrap">Fecha límite · mínimo ${c.minPay ? '' : 'aprox. '}<b class="num">${money0(estMin(c))}</b>${st.paid > 0.5 ? ` · ya abonaste ${money0(st.paid)}` : ''}</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">${st.paid >= estMin(c) - 0.5 ? '<span class="pill ok">Mínimo cubierto</span>' : dueLabel(st.due, today)}</div></div>` });
    else items.push({ date: st.nextDue, html: `<div class="row">${calChip(st.nextDue)}<div class="grow"><div class="t">${esc(c.name)}</div><div class="s">Al día · próximo corte ${fmtDay(st.nextCut)}</div></div><span class="pill ok">Pagada</span></div>` });
  }
  for (const r of S.recurring) {
    if (r.active === false) continue;
    for (const d of occurrences(r, addDays(today, -20), addDays(today, 35))) {
      const ds = ymd(d); if ((r.paid || []).includes(ds)) continue;
      items.push({ date: d, html: `<div class="row">${calChip(d)}<div class="grow"><div class="t">${esc(r.name)}</div><div class="s"><span class="num">${money(r.amount)}</span> · ${esc(srcShort(r.from))}${r.auto ? ' · se registra solo' : ''}</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">${dueLabel(d, today)}${r.auto ? '' : `<button class="btn sm" data-payrec="${r.id}" data-occ="${ds}">Ya pagué</button>`}</div></div>` });
    }
  }
  items.sort((a, b) => a.date - b.date);

  // Presupuesto (solo si definiste alguno)
  const mStart = ymd(new Date(today.getFullYear(), today.getMonth(), 1));
  const spentBy = {}; S.txns.filter(t => t.type === 'gasto' && t.date >= mStart && t.date <= todayS()).forEach(t => spentBy[t.cat] = (spentBy[t.cat] || 0) + t.amount);
  const budgets = S.categories.filter(c => c.budget > 0).map(c => {
    const s = spentBy[c.id] || 0; const p = Math.min(100, s / c.budget * 100);
    return `<div class="it"><div class="l"><span>${esc(c.name)}</span><span class="num ${s > c.budget ? '' : 'muted'}" ${s > c.budget ? 'style="color:var(--danger)"' : ''}>${money0(s)} / ${money0(c.budget)}</span></div><div class="bar ${p >= 100 ? 'over' : p >= 80 ? 'warn' : ''}"><span style="width:${p}%;background:${p < 80 ? c.color : ''}"></span></div></div>`;
  }).join('');

  const recent = [...S.txns].sort((a, b) => b.date.localeCompare(a.date) || (b.id > a.id ? 1 : -1)).slice(0, 5);

  return `
  <header class="top"><div><div class="sub">${fmtLong(today)}</div><h1>Mis Finanzas</h1></div></header>

  <section class="hero" aria-label="Deuda total">
    <div><div class="lbl">Deuda total en tarjetas</div><div class="big num">${money(debt)}</div></div>
    <div class="stack" aria-hidden="true">${stack}</div>
    <div class="legend">${legend}</div>
    ${debt > 0.5 ? `<div class="prog"><div class="l"><span>Llevas ${Math.round(progress)}% pagado</span><span>${freeDate ? `Meta: libre en ${MONTHS_LONG[freeDate.getMonth()]} ${freeDate.getFullYear()}` : 'Ajusta tu plan'}</span></div><div class="pbar"><span style="width:${progress}%"></span></div></div>` : ''}
    <div class="delta">${w.paidCards || w.onCards ? `Esta semana abonaste ${money0(w.paidCards)}${w.onCards ? ` y cargaste ${money0(w.onCards)}` : ''}: tu deuda ${net >= 0 ? `bajó ${money0(net)}` : `subió ${money0(-net)}`}.` : 'Esta semana aún no hay abonos ni cargos.'}</div>
  </section>

  <section class="section">
    <h2>${isPayday ? 'Hoy es día de pago' : 'Tu semana'} <span class="small muted" style="text-transform:none;letter-spacing:0">${fmtDay(w.start)} – ${fmtDay(w.end)}</span></h2>
    <div class="list">${stepsHtml}</div>
    ${allDone ? '<div class="info">Listo: sueldo repartido y abonos hechos esta semana.</div>' : ''}
    <div class="panel week">
      <div class="head"><div><div class="small muted">Te queda para vivir esta semana</div><div class="big num" style="color:${w.left < 0 ? 'var(--danger)' : 'var(--ink)'}">${money0(w.left)}</div></div><div class="small muted num">Gastado ${money0(w.variable)} de ${money0(Math.max(0, w.weeklyFree))}</div></div>
      <div class="bar ${barCls}"><span style="width:${pct}%"></span></div>
      ${w.weeklyFree <= 0 ? '<div class="info warn">Con estos montos no te queda nada para vivir. Baja el abono semanal en <b>Plan</b> para no terminar usando la tarjeta.</div>' : ''}
      <div class="small muted">Lo que pagas con tarjeta también se resta de aquí: ese dinero ya lo debes.${w.onCards ? ` Esta semana llevas <b class="num">${money0(w.onCards)}</b> con tarjeta.` : ''}</div>
    </div>
  </section>

  <section class="section">
    <h2>Si pagas con tarjeta hoy</h2>
    <div class="list">${S.cards.map(c => { const pi = purchaseInfo(c, todayS()); return `<div class="row"><i class="dot" style="background:${cardColor(c)}"></i><div class="grow"><div class="t">${esc(c.short)}: la pagas el ${fmtDay(pi.due)}</div><div class="s">Entra al corte del ${fmtDay(pi.cut)} · ${pi.days} días para pagar</div></div></div>`; }).join('')}</div>
    ${debt > 0.5 ? '<div class="small muted" style="margin:0 4px">Mientras traigas saldo, lo que compres genera intereses desde el día de la compra.</div>' : ''}
  </section>

  <section class="section">
    <h2>Próximos pagos</h2>
    <div class="list">${items.map(i => i.html).join('') || '<div class="empty">No hay pagos próximos.</div>'}</div>
  </section>

  <section class="section">
    <h2>Mis cuentas</h2>
    <div class="tiles">${S.accounts.map(a => `<button class="tile" style="border:0;text-align:left" data-editacct="${a.id}"><span class="n">${esc(a.name)}</span><span class="v num">${money(acctBalance(a.id))}</span></button>`).join('')}</div>
  </section>

  ${budgets ? `<section class="section">
    <h2>Presupuesto de ${MONTHS_SHORT[today.getMonth()]} <button class="linkbtn" data-go="presupuesto">Editar</button></h2>
    <div class="panel budget">${budgets}</div>
  </section>` : ''}

  <section class="section">
    <h2>Últimos movimientos <a href="#movimientos">Ver todos</a></h2>
    <div class="list">${recent.map(txnRow).join('') || '<div class="empty">Aún no registras nada. Toca <b>+</b> para agregar tu primer gasto.</div>'}</div>
  </section>`;
}

function txnRow(t) {
  const c = cat(t.cat);
  let title = t.desc || c.name, sub = '', amt = '', cls = 'neg';
  if (t.type === 'gasto') { sub = `${c.name} · ${srcShort(t.from)}`; amt = '−' + money(t.amount); }
  else if (t.type === 'ingreso') { sub = `${c.name} · a ${srcShort(t.to)}`; amt = '+' + money(t.amount); cls = 'pos'; }
  else if (t.type === 'pago') { title = t.desc || `Pago a ${srcShort(t.to)}`; sub = `Pago de tarjeta · desde ${srcShort(t.from)}`; amt = money(t.amount); }
  else if (t.type === 'mover') { title = t.desc || `${srcShort(t.from)} → ${srcShort(t.to)}`; sub = 'Movimiento entre cuentas'; amt = money(t.amount); cls = 'muted'; }
  else if (t.type === 'ajuste') { title = t.desc || 'Ajuste de saldo'; sub = `Ajuste · ${srcShort(t.to)}`; amt = (t.amount >= 0 ? '+' : '−') + money(Math.abs(t.amount)); cls = 'muted'; }
  const color = t.type === 'gasto' || t.type === 'ingreso' ? c.color : 'var(--muted)';
  return `<button class="row" data-txn="${t.id}"><i class="dot" style="background:${color};width:10px;height:10px"></i><div class="grow"><div class="t">${esc(title)}</div><div class="s">${esc(sub)} · ${fmtDay(parseD(t.date))}</div></div><div class="amt num ${cls}">${amt}</div></button>`;
}

function planThisMonth() { return weekPlan().alloc; }

// =========================================================
let movMonth = null;
function viewMovimientos() {
  const t0 = todayD(); if (!movMonth) movMonth = { y: t0.getFullYear(), m: t0.getMonth() };
  const { y, m } = movMonth;
  const a = ymd(new Date(y, m, 1)), b = ymd(new Date(y, m + 1, 0));
  const tx = S.txns.filter(t => t.date >= a && t.date <= b).sort((p, q) => q.date.localeCompare(p.date) || (q.id > p.id ? 1 : -1));
  const gastos = tx.filter(t => t.type === 'gasto');
  const totalG = gastos.reduce((s, t) => s + t.amount, 0);
  const totalI = tx.filter(t => t.type === 'ingreso').reduce((s, t) => s + t.amount, 0);
  const byCat = {}; gastos.forEach(t => byCat[t.cat] = (byCat[t.cat] || 0) + t.amount);
  const cats = Object.entries(byCat).sort((p, q) => q[1] - p[1]);
  const max = cats.length ? cats[0][1] : 1;
  const byFrom = {}; gastos.forEach(t => byFrom[t.from] = (byFrom[t.from] || 0) + t.amount);

  let groups = '', lastDate = '';
  let buf = [];
  const flush = () => { if (buf.length) { groups += `<div class="daylabel">${fmtLong(parseD(lastDate))}</div><div class="list">${buf.join('')}</div>`; buf = []; } };
  for (const t of tx) { if (t.date !== lastDate) { flush(); lastDate = t.date; } buf.push(txnRow(t)); }
  flush();

  return `
  <header class="top"><div><h1>Movimientos</h1></div></header>
  <div class="monthnav"><button class="iconbtn" id="prevM" aria-label="Mes anterior">‹</button><b>${fmtMonth(y, m)}</b><button class="iconbtn" id="nextM" aria-label="Mes siguiente">›</button></div>
  <div class="kpis"><div class="kpi"><span class="n">Gastaste</span><span class="v num">${money0(totalG)}</span></div><div class="kpi"><span class="n">Ingresos</span><span class="v num" style="color:var(--ok)">${money0(totalI)}</span></div></div>
  <section class="section"><h2>¿En qué se fue el dinero?</h2>
    <div class="panel hbars">${cats.map(([id, v]) => { const c = cat(id); return `<div class="hbar"><div class="l"><span><i class="dot" style="background:${c.color}"></i>${esc(c.name)}</span><span class="num">${money0(v)} <span class="muted">${totalG ? Math.round(v / totalG * 100) : 0}%</span></span></div><div class="bar"><span style="width:${v / max * 100}%;background:${c.color}"></span></div></div>`; }).join('') || '<div class="empty">Sin gastos este mes.</div>'}</div>
  </section>
  ${Object.keys(byFrom).length ? `<section class="section"><h2>¿Con qué pagaste?</h2><div class="list">${Object.entries(byFrom).sort((p, q) => q[1] - p[1]).map(([id, v]) => `<div class="row"><div class="grow"><div class="t">${esc(srcName(id))}</div></div><div class="amt num">${money(v)}</div></div>`).join('')}</div></section>` : ''}
  <section class="section"><h2>Detalle</h2>${groups || '<div class="list"><div class="empty">Sin movimientos este mes.</div></div>'}</section>`;
}

// =========================================================

// =========================================================
function viewPlan() {
  const debt = totalDebt();
  const st = S.settings; const today = todayD();
  const fixedW = fixedWeekly();
  const living = livingWeekly();
  const essentialsMonth = ((Number(st.rentWeekly) || 0) + fixedW + Math.max(800, living)) * WEEKS_PER_MONTH;
  const emergencyGoal = Math.ceil(essentialsMonth / 1000) * 1000;
  const fmtM = n => n === Infinity ? 'Nunca' : n === 1 ? '1 mes' : n < 12 ? `${n} meses` : `${Math.floor(n / 12)} año${n >= 24 ? 's' : ''}${n % 12 ? ` ${n % 12} m` : ''}`;
  const monthOf = n => { const d = dateFor(today.getFullYear(), today.getMonth() + n - 1, 1); return `${MONTHS_LONG[d.getMonth()]} ${d.getFullYear()}`; };
  const flow = (dw) => `
      <div class="fl"><span>Sueldo</span><span class="num" style="color:var(--ok)">${money0(st.weeklyIncome)}</span></div>
      <div class="fl"><span>Renta (tu parte)</span><span class="num">−${money0(st.rentWeekly || 0)}</span></div>
      <div class="fl"><span>Gimnasio y suscripciones</span><span class="num">−${money0(fixedW)}</span></div>
      ${dw > 0 ? `<div class="fl"><span>Abono a tarjetas</span><span class="num">−${money0(dw)}</span></div>` : ''}
      ${st.savingsWeekly ? `<div class="fl"><span>Ahorro</span><span class="num">−${money0(st.savingsWeekly)}</span></div>` : ''}
      <div class="fl total"><span>Para vivir (comida, transporte, salidas)</span><span class="num" style="color:${livingWeekly(dw) < 0 ? 'var(--danger)' : 'var(--ink)'}">${money0(livingWeekly(dw))}</span></div>`;

  const tips = `
    <div class="tips">
      <div class="tip"><b>Cómo funciona la fecha de corte</b><span>Lo que compras <b>antes</b> del corte se paga en ~20 días. Lo que compras <b>después</b> del corte se va hasta el siguiente mes. Con la Joy: si compras el 4 de diciembre lo pagas el 25 de diciembre; si compras el 6, hasta el 25 de enero. En Inicio siempre ves cuándo pagarías una compra de hoy.</span></div>
      <div class="tip"><b>Si te falta dinero, mejor abona menos</b><span>Usar la tarjeta para la semana te cuesta alrededor de 5.9% al mes. Si una semana no te alcanza, baja el abono de esa semana en lugar de cargar a la Joy: el resultado es el mismo y no pagas intereses extra.</span></div>
      ${card('clasica') ? `<div class="tip"><b>La Clásica cobra comisión mensual</b><span>Banamex publica $67.92 + IVA (≈${money0(card('clasica').fee || 78.79)}) al mes aunque no la uses. Cuando la liquides, pide que te la cambien a una sin anualidad o cancélala.</span></div>` : ''}
      ${card('joy') ? `<div class="tip"><b>Ojo con la Joy cuando la liquides</b><span>Banamex publica una penalización de $149 al mes si no gastas al menos $300. Puedes dejarle cargadas tus suscripciones y pagarla completa cada mes. Confírmalo en tu contrato.</span></div>` : ''}
    </div>`;

  if (debt <= 0.5) {
    const save = st.savingsWeekly || 0;
    return `<header class="top"><div><h1>Plan</h1></div></header>
      <div class="panel"><b style="font-size:20px">Sin deudas en tarjetas</b><p class="muted">Ahora lo que abonabas a tarjetas va a tu ahorro. Úsalas solo para lo que puedas pagar completo antes de la fecha límite.</p></div>
      <section class="section"><h2>Tu semana en números</h2><div class="panel flow">${flow(0)}</div></section>
      <section class="section"><h2>Siguiente etapa</h2><div class="panel">Fondo de emergencia: junta <b class="num">${money0(emergencyGoal)}</b> (un mes de tus gastos). ${save ? `Con ${money0(save)} por semana lo logras en ${Math.ceil(emergencyGoal / save)} semanas.` : 'Define tu ahorro semanal en Más → Sueldo y reparto.'}</div></section>
      <section class="section"><h2>Consejos</h2>${tips}</section>`;
  }

  const weekly = debtWeekly();
  const monthly = weekly * WEEKS_PER_MONTH;
  const { av, sb, pick, chosen } = bestStrategy(monthly);
  const options = [1000, 1200, 1500, 1800, 2000, 2200, 2500].filter(x => x !== weekly).concat(weekly).sort((a, b) => a - b)
    .map(x => { const r = simulate(x * WEEKS_PER_MONTH, 'bola'); return { x, r, live: livingWeekly(x) }; });
  const rows = chosen.rows.slice(0, 24);
  const cardIds = S.cards.map(c => c.id);
  const targetM = Number(sessionStorageGet('targetMonths') || 4);
  const neededW = Math.ceil(paymentForMonths(targetM, 'bola') / WEEKS_PER_MONTH / 50) * 50;
  const startDebt = (S.planStart && S.planStart.debt) || debt;
  const progress = Math.max(0, Math.min(100, (startDebt - debt) / startDebt * 100));
  const focus = S.cards.map(c => ({ c, b: cardBalance(c.id) })).filter(x => x.b > 0.5).sort((p, q) => p.b - q.b);

  return `
  <header class="top"><div><h1>Plan para salir de deudas</h1></div></header>

  <section class="section"><h2>Tu semana en números</h2>
    <div class="panel flow">${flow(weekly)}</div>
    <div class="panel" style="display:flex;flex-direction:column;gap:10px">
      <div class="field"><label for="debtWeekly">¿Cuánto abonas a tarjetas cada ${WEEKDAYS[st.payWeekday]}?</label>
        <input class="input num" id="debtWeekly" inputmode="decimal" value="${Math.round(weekly)}"></div>
      <div class="chips">${[1200, 1500, 1800, 2000, 2500].map(x => `<button type="button" class="chip" data-weekly="${x}" aria-pressed="${x === weekly}">${money0(x)}</button>`).join('')}</div>
    </div>
  </section>

  <section class="section"><h2>Tu meta</h2>
    ${!chosen.feasible ? `<div class="info warn">Con ${money0(weekly)} por semana no alcanzas a cubrir los intereses. Sube el abono.</div>` : ''}
    <div class="panel" style="display:flex;flex-direction:column;gap:10px">
      <div style="font-size:22px;font-weight:700">Libre de deudas en ${chosen.months === Infinity ? '—' : MONTHS_LONG[dateFor(today.getFullYear(), today.getMonth() + chosen.months - 1, 1).getMonth()] + ' ' + dateFor(today.getFullYear(), today.getMonth() + chosen.months - 1, 1).getFullYear()}</div>
      <div class="muted small">${fmtM(chosen.months)} abonando ${money0(weekly)} cada semana y sin cargos nuevos. Pagarías unos <b class="num">${chosen.months === Infinity ? '—' : money0(chosen.totalInt)}</b> de intereses y comisiones.</div>
      <div class="bar"><span style="width:${progress}%"></span></div>
      <div class="small muted">Llevas ${Math.round(progress)}% de ${money0(startDebt)}.</div>
    </div>
  </section>

  <section class="section"><h2>Compara</h2>
    <div class="tablewrap"><table><thead><tr><th>Abono/semana</th><th>Para vivir</th><th>Terminas</th><th>Intereses</th></tr></thead><tbody>
      ${options.map(o => `<tr${o.x === weekly ? ' style="font-weight:700;background:var(--accent-soft)"' : ''}><td>${money0(o.x)}</td><td${o.live < 0 ? ' style="color:var(--danger)"' : ''}>${money0(o.live)}</td><td>${o.r.months === Infinity ? '—' : monthOf(o.r.months)}</td><td>${o.r.months === Infinity ? '—' : money0(o.r.totalInt)}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="small muted" style="margin:0 4px">"Para vivir" es lo que te queda cada semana para comida, transporte y salidas, ya sin renta, gimnasio ni suscripciones.</div>
  </section>

  <section class="section"><h2>El orden</h2>
    <div class="list">${focus.map((x, i) => `<div class="row"><span class="tick on" style="background:${cardColor(x.c)}">${i + 1}</span><div class="grow"><div class="t">${esc(x.c.name)}</div><div class="s wrap">${i === 0 ? 'Todo el abono va aquí. Es la más chica y además cobra comisión.' : 'Solo el pago mínimo antes de su fecha límite, hasta que liquides la anterior.'}</div></div><div class="amt num">${money0(x.b)}</div></div>`).join('')}</div>
    <div class="small muted" style="margin:0 4px">Cuando una fecha límite cae antes de tu siguiente día de pago, la app primero aparta el mínimo de esa tarjeta para que no te cobren por pago tardío.</div>
  </section>

  <section class="section"><h2>Tus etapas</h2>
    <div class="list">
      <div class="row"><span class="tick" style="border-color:var(--accent);color:var(--accent)">1</span><div class="grow"><div class="t">Salir de deudas <span class="pill ok">En curso</span></div><div class="s wrap">${money0(weekly)} por semana a tarjetas, hasta ${chosen.months === Infinity ? '—' : monthOf(chosen.months)}.</div></div></div>
      <div class="row"><span class="tick">2</span><div class="grow"><div class="t">Fondo de emergencia</div><div class="s wrap">Los mismos ${money0(weekly)} por semana hasta juntar <b class="num">${money0(emergencyGoal)}</b> (un mes de tus gastos). Te toma unas ${Math.ceil(emergencyGoal / Math.max(1, weekly))} semanas. Con esto ya no necesitas la tarjeta cuando te falte.</div></div></div>
      <div class="row"><span class="tick">3</span><div class="grow"><div class="t">Ahorro para tus metas</div><div class="s wrap">Ahorrando ${money0(weekly)} por semana juntas <b class="num">${money0(weekly * 52)}</b> al año. Si quieres, sube un poco tu dinero para vivir: te lo habrás ganado.</div></div></div>
    </div>
  </section>

  <section class="section"><h2>¿Y si quiero terminar en cierto tiempo?</h2>
    <div class="panel" style="display:flex;flex-direction:column;gap:10px">
      <div class="field"><label for="targetMonths">Quiero estar libre de deudas en (meses)</label><input class="input num" id="targetMonths" type="number" inputmode="numeric" min="1" max="36" value="${targetM}"></div>
      <div>Necesitas abonar <b class="num" style="font-size:20px">${money0(neededW)}</b> por semana. Te quedarían <b class="num">${money0(livingWeekly(neededW))}</b> para vivir.</div>
      <button class="btn" id="useTarget">Usar este abono</button>
    </div>
  </section>

  <section class="section"><h2>Mes a mes</h2>
    <div class="tablewrap"><table><thead><tr><th>Mes</th>${cardIds.map(id => `<th>A ${esc(card(id).short)}</th>`).join('')}<th>Intereses</th><th>Debes</th></tr></thead><tbody>
      ${rows.map(r => { const d = dateFor(today.getFullYear(), today.getMonth() + r.month - 1, 1); const tot = cardIds.reduce((s, id) => s + (r.bal[id] || 0), 0); return `<tr><td>${MONTHS_SHORT[d.getMonth()]} ${String(d.getFullYear()).slice(2)}</td>${cardIds.map(id => `<td>${money0(r.pay[id] || 0)}</td>`).join('')}<td>${money0(r.int)}</td><td>${money0(tot)}</td></tr>`; }).join('')}
    </tbody></table></div>
    <div class="small muted" style="margin:0 4px">Estimado con tasa de ${S.cards.map(c => `${c.short} ${c.rate}%`).join(', ')} anual más IVA. Cambia la tasa en Más si tu estado de cuenta dice otra.</div>
  </section>

  <section class="section"><h2>Consejos</h2>${tips}</section>`;
}
function sessionStorageGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
function sessionStorageSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }

function viewAjustes() {
  return `
  <header class="top"><div><h1>Más</h1></div></header>

        } else box.innerHTML = '';

      const pbox = $('#payInfo', container);

        $$('[data-fill]', pbox).forEach(b => b.addEventListener('click', () => { f.amount = b.dataset.fill; $('#f-amount', container).value = b.dataset.fill; }));
      }

      const amount = round2(parseFloat(String(f.amount).replace(/[$,\s]/g, '')));
      if (!(amount > 0)) { toast('Escribe el monto'); $('#f-amount', container).focus(); return; }
      if (f.type === 'mover' && f.from === f.to) { toast('Elige cuentas distintas'); return; }
      const t = { id: existing ? existing.id : uid(), date: f.date, type: existing && existing.type === 'ajuste' ? 'ajuste' : f.type, amount, desc: (f.desc || '').trim() };

      if (existing) { if (existing.rec) { t.rec = existing.rec; t.occ = existing.occ; t.auto = existing.auto; } S.txns = S.txns.map(x => x.id === t.id ? t : x); }
      else S.txns.push(t);

// Formato del Atajo: "120.50;OXXO;Joy" (monto;comercio;tarjeta)
function parseShortcut(text) {
  if (!text) return null;
  const parts = text.split(/[;|\n]/).map(s => s.trim()).filter(Boolean);
  if (!parts.length) return null;
  const amtStr = parts.find(p => /\d/.test(p) && /^[\s$MXN.,\d-]+$/i.test(p));
  const amount = amtStr ? parseFloat(amtStr.replace(/[^\d.,-]/g, '').replace(/,(?=\d{3}\b)/g, '').replace(',', '.')) : NaN;
  if (!(amount > 0)) return null;
  const rest = parts.filter(p => p !== amtStr);
  const low = text.toLowerCase();
  let from = null;
  for (const c of S.cards) { if (low.includes(c.short.toLowerCase()) || low.includes(c.short.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''))) from = c.id; }
  if (!from && /d[eé]bito/.test(low)) from = 'debito';
  const cardWords = S.cards.map(c => c.short.toLowerCase());
  const merchant = rest.find(p => !cardWords.some(w => p.toLowerCase().includes(w))) || '';
  return { amount: String(round2(amount)), desc: merchant, ...(from ? { from } : {}) };
}

    </div>
    <div class="grid2">
      <div class="field"><label for="r-freq">¿Cada cuándo?</label><select class="input" id="r-freq"><option value="mensual" ${r.freq === 'mensual' ? 'selected' : ''}>Mensual</option><option value="semanal" ${r.freq === 'semanal' ? 'selected' : ''}>Semanal</option><option value="anual" ${r.freq === 'anual' ? 'selected' : ''}>Anual</option></select></div>
      <div class="field" id="r-daywrap"></div>
    </div>
    <div class="field" id="r-monthwrap"></div>
    <div class="grid2">
      <div class="field"><label for="r-from">Se paga con</label><select class="input" id="r-from">${[...S.accounts, ...S.cards].map(s => `<option value="${s.id}" ${s.id === r.from ? 'selected' : ''}>${esc(s.short || s.name)}</option>`).join('')}</select></div>
      <div class="field"><label for="r-cat">Categoría</label><select class="input" id="r-cat">${S.categories.map(c => `<option value="${c.id}" ${c.id === r.cat ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></div>
    </div>
    <label class="check"><input type="checkbox" id="r-auto" ${r.auto ? 'checked' : ''}> Registrar el cobro solo cuando llegue la fecha</label>
    <div class="small muted" style="margin-top:-8px">Útil para suscripciones que se cobran solas a la tarjeta. Si lo dejas apagado, te aparece en "Próximos pagos" con un botón para registrarlo.</div>
    ${id ? `<label class="check"><input type="checkbox" id="r-active" ${r.active !== false ? 'checked' : ''}> Activa</label>` : ''}
    <div class="btns"><button class="btn primary" style="flex:1" id="r-save">Guardar</button>${id ? '<button class="btn danger" id="r-del">Eliminar</button>' : ''}</div>`, sh => {
    const dayWrap = $('#r-daywrap', sh), monthWrap = $('#r-monthwrap', sh), freq = $('#r-freq', sh);
    const drawDay = () => {
      if (freq.value === 'semanal') dayWrap.innerHTML = `<label for="r-day">Día</label><select class="input" id="r-day">${WEEKDAYS.map((d, i) => `<option value="${i}" ${i == r.day ? 'selected' : ''}>${d}</option>`).join('')}</select>`;
      else dayWrap.innerHTML = `<label for="r-day">Día del mes</label><input class="input num" id="r-day" type="number" min="1" max="31" value="${r.freq === 'semanal' ? 1 : r.day}">`;
      monthWrap.innerHTML = freq.value === 'anual' ? `<label for="r-month">Mes</label><select class="input" id="r-month">${MONTHS_SHORT.map((m, i) => `<option value="${i}" ${i == r.month ? 'selected' : ''}>${m}</option>`).join('')}</select>` : '';
    };
    freq.addEventListener('change', drawDay); drawDay();
    $('#r-from', sh).addEventListener('change', e => { if (isCard(e.target.value) && $('#r-kind', sh).value === 'suscripcion') $('#r-auto', sh).checked = true; });
    $$('[data-preset]', sh).forEach(b => b.addEventListener('click', () => {
      const [n, c, k] = b.dataset.preset.split('|');
      $('#r-name', sh).value = n; $('#r-cat', sh).value = c; $('#r-kind', sh).value = k;
      if (k === 'suscripcion') { $('#r-from', sh).value = S.cards[S.cards.length - 1].id; $('#r-auto', sh).checked = true; }
      if (n === 'Renta') $('#r-from', sh).value = 'ahorro';
      $('#r-amt', sh).focus();
    }));
    $('#r-save', sh).addEventListener('click', () => {
      const amount = round2(parseFloat($('#r-amt', sh).value));
      const name = $('#r-name', sh).value.trim();
      if (!name) { toast('Ponle un nombre'); return; }
      if (!(amount > 0)) { toast('Escribe el monto'); return; }
      const obj = { name, amount, kind: $('#r-kind', sh).value, freq: freq.value, day: Number($('#r-day', sh).value) || 1, month: Number(($('#r-month', sh) || { value: 0 }).value), from: $('#r-from', sh).value, cat: $('#r-cat', sh).value, auto: $('#r-auto', sh).checked };
      if (id) { Object.assign(r, obj); const act = $('#r-active', sh); r.active = act ? act.checked : true; }
      else S.recurring.push({ id: uid(), ...obj, active: true, start: todayS(), paid: [] });
      const n = runAutoCharges();
      save(); closeSheet(); route(); toast(n ? `Guardado · ${n} cobro registrado` : 'Guardado');
    });
    const del = $('#r-del', sh);
    if (del) twoTap(del, 'Toca otra vez', () => { S.recurring = S.recurring.filter(x => x.id !== id); save(); closeSheet(); route(); toast('Eliminado'); });
  });
}
function openPresupuesto() {
  const fixedCats = ['renta', 'servicios', 'gimnasio', 'suscripciones', 'intereses'];
  openSheet('Presupuesto mensual', `
    <div class="small muted">Cuánto quieres gastar al mes en cada cosa del día a día. Renta, servicios, gimnasio y suscripciones se calculan solos con tus pagos fijos.</div>
    <div class="list">${S.categories.filter(c => !fixedCats.includes(c.id)).map(c => `<div class="row"><i class="dot" style="background:${c.color}"></i><label class="grow" for="b-${c.id}">${esc(c.name)}</label><input class="input num" style="width:120px;text-align:right" id="b-${c.id}" inputmode="decimal" value="${c.budget || ''}" placeholder="0"></div>`).join('')}</div>
    <button class="btn primary" id="b-save">Guardar</button>`, sh => {
    $('#b-save', sh).addEventListener('click', () => {
      S.categories.forEach(c => { const el = $(`#b-${c.id}`, sh); if (el) c.budget = Math.max(0, parseFloat(el.value) || 0); });
      save(); closeSheet(); route(); toast('Presupuesto guardado');
    });
  });
}
function openAtajo() {
  const ex = `${'120.50'};OXXO;${S.cards[1] ? S.cards[1].short : 'Joy'}`;
  openSheet('Atajo de Apple Pay', `
    <div class="small">Cada vez que pagues con Apple Pay, el iPhone puede copiar el monto, el comercio y la tarjeta. Luego solo abres la app, tocas <b>+</b> y pegas.</div>
    <ol class="steps">
      <li>Abre la app <b>Atajos</b> → pestaña <b>Automatización</b> → <b>+</b> → <b>Transacción</b> (Wallet).</li>
      <li>Elige tus tarjetas Banamex, deja marcado <b>"Ejecutar inmediatamente"</b> y toca <b>Siguiente</b> → <b>Nueva automatización en blanco</b>.</li>
      <li>Agrega la acción <b>Texto</b> y escribe: <span class="code">Importe;Comercio;Tarjeta</span>, usando las variables azules de la transacción (toca cada palabra y elige la variable) separadas por punto y coma.</li>
      <li>Agrega la acción <b>Copiar al portapapeles</b>.</li>
      <li>Opcional: agrega <b>Mostrar notificación</b> con el texto "Registra tu gasto en Mis Finanzas".</li>
    </ol>
    <div class="small muted">El texto copiado se verá así: <span class="code">${esc(ex)}</span>. Al pegarlo, la app llena el monto, la descripción y la tarjeta; tú solo eliges la categoría.</div>
    <div class="field"><label for="t-try">Pruébalo aquí</label><input class="input" id="t-try" value="${esc(ex)}"></div>
    <div id="t-out" class="info"></div>`, sh => {
    const run = () => { const p = parseShortcut($('#t-try', sh).value); $('#t-out', sh).innerHTML = p ? `Monto <b class="num">${money(+p.amount)}</b> · ${esc(p.desc || '(sin comercio)')} · ${p.from ? esc(srcName(p.from)) : 'tarjeta no reconocida'}` : 'No encontré un monto en ese texto.'; };
    $('#t-try', sh).addEventListener('input', run); run();
  });
}
function openInstalar() {
  openSheet('Instalar en el iPhone', `
    <ol class="steps">
      <li>Abre esta página en <b>Safari</b>.</li>
      <li>Toca el botón <b>Compartir</b> (el cuadrito con flecha hacia arriba).</li>
      <li>Baja y elige <b>"Agregar a pantalla de inicio"</b> → <b>Agregar</b>.</li>
      <li>Abre la app siempre desde ese ícono. Ojo: lo que registres en Safari y en el ícono se guarda por separado, así que usa solo el ícono.</li>
    </ol>
    <div class="info">Funciona sin internet y tus datos se quedan en tu iPhone. Haz un respaldo de vez en cuando desde "Respaldo de datos".</div>`);
}
function openRespaldo() {
  const json = JSON.stringify(S);
  openSheet('Respaldo de datos', `
    <div class="small">Guarda una copia de todo (movimientos, tarjetas, pagos fijos) en Archivos o iCloud Drive. Si cambias de iPhone o se borra Safari, la importas y listo.</div>
    <button class="btn primary" id="x-exp">Exportar respaldo</button>
    <button class="btn" id="x-copy">Copiar respaldo como texto</button>
    <button class="btn" id="x-imp">Importar respaldo</button>
    <div class="field"><label for="x-text">O pega aquí el texto de un respaldo</label><textarea class="input" id="x-text" rows="3" placeholder='{"version":1,…}'></textarea><button class="btn sm" id="x-load">Cargar texto</button></div>
    <div class="small muted">${S.txns.length} movimientos · ${(json.length / 1024).toFixed(1)} KB</div>
    <button class="btn danger" id="x-reset">Borrar todo y empezar de cero</button>`, sh => {
    $('#x-exp', sh).addEventListener('click', async () => {
      const name = `mis-finanzas-${todayS()}.json`;
      const file = new File([JSON.stringify(S, null, 1)], name, { type: 'application/json' });
      try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
      try { const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove(); toast('Respaldo descargado'); } catch (e) { toast('No se pudo exportar; usa "Copiar"'); }
    });
    $('#x-copy', sh).addEventListener('click', () => {
      navigator.clipboard.writeText(JSON.stringify(S)).then(() => toast('Copiado. Pégalo en Notas'), () => { const ta = $('#x-text', sh); ta.value = JSON.stringify(S); ta.select(); toast('Selecciona y copia el texto'); });
    });
    $('#x-imp', sh).addEventListener('click', () => $('#importFile').click());
    $('#x-load', sh).addEventListener('click', () => importText($('#x-text', sh).value));
    twoTap($('#x-reset', sh), 'Toca otra vez para borrar TODO', () => { S = defaultState(); save(); closeSheet(); route(); toast('Datos borrados'); });
  });
}
function importText(txt) {
  try {
    const d = JSON.parse(txt);
    if (!d || !Array.isArray(d.txns) || !Array.isArray(d.cards)) throw new Error('formato');
    S = d; save(); closeSheet(); route(); toast(`Respaldo cargado · ${d.txns.length} movimientos`);
  } catch (e) { toast('Ese archivo no es un respaldo válido'); }
}
$('#importFile').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => importText(r.result); r.readAsText(f); e.target.value = ''; });

// =========================================================
//  ROUTER
// =========================================================
const VIEWS = { inicio: viewInicio, movimientos: viewMovimientos, plan: viewPlan, ajustes: viewAjustes };
function route() {
  const name = (location.hash || '#inicio').slice(1);
  const v = VIEWS[name] ? name : 'inicio';
  const app = $('#app');
  app.innerHTML = VIEWS[v]();
  $$('.tabs a').forEach(a => { if (a.dataset.tab === v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  bindView(app, v);
}
function bindView(app, v) {
  $$('[data-txn]', app).forEach(b => b.addEventListener('click', () => openTxn({}, b.dataset.txn)));
  $$('[data-paycard]', app).forEach(b => b.addEventListener('click', () => {
    const c = card(b.dataset.paycard); const st = cardStatus(c); const plan = planThisMonth()[c.id] || 0;
    openTxn({ type: 'pago', to: c.id, from: 'debito', amount: String(round2(plan > 0.5 ? Math.min(plan, st.pending) : st.pending)) });
  }));
  $$('[data-payrec]', app).forEach(b => b.addEventListener('click', () => {
    const r = S.recurring.find(x => x.id === b.dataset.payrec);
    openTxn({ type: 'gasto', amount: String(r.amount), desc: r.name, cat: r.cat, from: r.from, rec: r.id, occ: b.dataset.occ, date: todayS() });
  }));
  $$('[data-editacct]', app).forEach(b => b.addEventListener('click', () => openAcct(b.dataset.editacct)));
  $$('[data-editcard]', app).forEach(b => b.addEventListener('click', () => openCard(b.dataset.editcard)));
  $$('[data-editrec]', app).forEach(b => b.addEventListener('click', () => openRecurring(b.dataset.editrec)));
  $$('[data-go]', app).forEach(b => b.addEventListener('click', () => ({ sueldo: openSueldo, recurrentes: () => openRecurring(null), presupuesto: openPresupuesto, atajo: openAtajo, instalar: openInstalar, respaldo: openRespaldo })[b.dataset.go]()));
  const sal = $('#addSalary', app);
  if (sal) sal.addEventListener('click', () => {
    S.txns.push({ id: uid(), date: todayS(), type: 'ingreso', amount: S.settings.weeklyIncome, cat: 'sueldo', to: S.settings.incomeAccount, desc: 'Sueldo' });
    save(); route(); toast('Sueldo registrado');
  });
  const rent = $('#setRent', app);
  if (rent) rent.addEventListener('click', () => {
    const amt = round2(S.settings.rentWeekly - weekStats().rentSet);
    if (amt <= 0) return;
    S.txns.push({ id: uid(), date: todayS(), type: 'mover', amount: amt, from: S.settings.incomeAccount, to: S.settings.rentAccount, desc: 'Apartado para la renta' });
    save(); route(); toast(`Apartaste ${money0(amt)} para la renta`);
  });
  $$('[data-abono]', app).forEach(b => b.addEventListener('click', () => openTxn({ type: 'pago', to: b.dataset.abono, from: S.settings.incomeAccount, amount: b.dataset.amt })));
  if (v === 'movimientos') {
    $('#prevM', app).addEventListener('click', () => { movMonth = { y: movMonth.m === 0 ? movMonth.y - 1 : movMonth.y, m: (movMonth.m + 11) % 12 }; route(); });
    $('#nextM', app).addEventListener('click', () => { movMonth = { y: movMonth.m === 11 ? movMonth.y + 1 : movMonth.y, m: (movMonth.m + 1) % 12 }; route(); });
  }
  if (v === 'plan') {
    const dw = $('#debtWeekly', app);
    if (dw) {
      dw.addEventListener('change', () => { const x = parseFloat(dw.value.replace(/[$,]/g, '')); S.settings.debtWeekly = x >= 0 ? x : 0; save(); route(); });
      $$('[data-weekly]', app).forEach(b => b.addEventListener('click', () => { S.settings.debtWeekly = Number(b.dataset.weekly); save(); route(); toast(`Abono de ${money0(S.settings.debtWeekly)} por semana`); }));
      const tm = $('#targetMonths', app);
      tm.addEventListener('change', () => { sessionStorageSet('targetMonths', Math.min(36, Math.max(1, parseInt(tm.value) || 4))); route(); });
      $('#useTarget', app).addEventListener('click', () => { S.settings.debtWeekly = Math.ceil(paymentForMonths(Number(sessionStorageGet('targetMonths') || 4), 'bola') / WEEKS_PER_MONTH / 50) * 50; save(); route(); toast('Plan actualizado'); });
    }
  }
}
$('#fab').addEventListener('click', () => openTxn());
window.addEventListener('hashchange', () => { closeSheet(); route(); window.scrollTo(0, 0); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (runAutoCharges()) route(); } });

// ---------- Arranque ----------
load();
runAutoCharges();
route();
try { if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude|anthropic/.test(location.hostname)) navigator.serviceWorker.register('sw.js'); } catch (e) {}
</script>
</body>
</html>
